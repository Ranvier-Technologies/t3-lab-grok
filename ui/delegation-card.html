<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delegation</title>
<style>
  :root {
    color-scheme: dark;
    --background: #000;
    --muted: #0a0a0a;
    --accent: #191a1d;
    --border: rgb(255 255 255 / 8%);
    --input: rgb(255 255 255 / 18%);
    --faint: #6e6e6e;
    --muted-foreground: #a3a3a3;
    --foreground: #f1f3f7;
    --radius: 10px;
    --control-radius: 8px;
    --sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--background); color: var(--foreground); }
  body { padding: 8px; font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .card { background: var(--muted); border: 1px solid var(--border); border-radius: calc(var(--radius) + 2px); padding: 14px; }

  header { display: flex; align-items: center; gap: 8px; height: 22px; }
  .logo { flex: none; width: 18px; height: 18px; border-radius: 5px; }
  .brand { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; }
  .phase {
    font-size: 11px; line-height: 18px; padding: 0 7px; color: var(--muted-foreground);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .pill {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    height: 22px; padding: 0 9px 0 8px; border-radius: 999px; border: 1px solid var(--border);
    font-size: 11.5px; font-weight: 500; white-space: nowrap; color: var(--muted-foreground);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill[data-status="queued"] .dot { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
  .pill[data-status="running"] { color: var(--foreground); border-color: var(--input); }
  .pill[data-status="running"] .dot { animation: status-pulse 2s infinite; }
  .pill[data-status="waiting"] { color: var(--foreground); border-color: var(--input); }
  .pill[data-status="waiting"] .dot { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
  .pill[data-status="done"] { color: var(--foreground); background: var(--accent); }
  .pill[data-status="stopped"] .dot { border-radius: 1px; }
  .pill[data-status="error"] { color: var(--background); background: var(--foreground); border-color: var(--foreground); }
  @keyframes status-pulse {
    0%, 40% { opacity: 1; animation-timing-function: steps(6); }
    50%, 90% { opacity: 0.5; animation-timing-function: steps(6); }
    100% { opacity: 1; }
  }

  h1 {
    margin: 12px 0 0; font-size: 15px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }

  .meta { margin-top: 8px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tile {
    flex: none; display: grid; place-items: center; width: 22px; height: 22px;
    background: var(--accent); border: 1px solid var(--border); border-radius: 6px;
  }
  .tile svg { width: 14px; height: 14px; display: block; }
  #agent-name { flex: none; font-size: 13px; font-weight: 500; }
  #agent-model {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--mono); font-size: 12px; color: var(--muted-foreground);
  }
  #thread { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  #elapsed { font-weight: 400; opacity: 0.7; }
  #elapsed::before { content: "· "; }

  .summary { margin-top: 10px; }
  #summary { margin: 0; color: var(--muted-foreground); white-space: pre-line; overflow-wrap: anywhere; }
  #summary.clamped { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #summary .command { font-family: var(--mono); font-size: 12px; color: var(--foreground); }
  .more { margin-top: 2px; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--faint); }
  .more:hover { color: var(--foreground); }

  .url {
    margin-top: 12px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px;
    background: var(--background); border: 1px solid var(--border); border-radius: var(--control-radius);
  }
  #url-label { flex: none; font-size: 11px; font-weight: 500; color: var(--faint); }
  #url { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; color: var(--muted-foreground); user-select: all; }

  #hint { margin: 6px 0 0; font-size: 12px; line-height: 1.4; color: var(--faint); }

  .actions { margin-top: 12px; display: flex; gap: 8px; }
  .btn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: var(--control-radius); cursor: pointer;
    font: inherit; font-weight: 500; transition: background-color 120ms ease;
  }
  .btn:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }
  .primary { flex: 1; background: var(--foreground); color: var(--background); border: 1px solid var(--foreground); }
  .primary:hover { background: #d4d6db; }
  .secondary { background: none; color: var(--foreground); border: 1px solid var(--input); }
  .secondary:hover { background: var(--accent); }
  .btn svg { width: 14px; height: 14px; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .pill .dot { animation: none !important; }
  }
</style>
</head>

    $("thread").textContent = id8 ? "thread · " + id8 : "";
    $("thread").title = card.threadId || "";

    var lines = notice ? notice.split("\n").map(plainLine).filter(Boolean) : parsed.body;
    if (!notice && status === "waiting" && card.ask && card.ask.kind) {
      lines = askLines(card.ask, agent).concat(lines.filter(function (line) { return !WAITING_LINE.test(line); }));
    }
    setSummary(lines.length ? lines : [plainLine(card.excerpt || "") || IDLE[status]]);

    showUrl(link.row);
    $("hint").hidden = !link.hint;
    $("hint").textContent = link.hint;
    $("actions").hidden = !link.copy;
    $("open").hidden = !link.open;
    $("open").dataset.url = link.open;
    $("open-label").textContent = link.openLabel;
    $("copy").hidden = !link.copy;
    $("copy").dataset.value = link.copy;
    $("copy").className = "btn " + (link.open ? "secondary" : "primary");
    reportSize();
  }

  function stop() {
    stopped = true;
    if (timer) { clearTimeout(timer); timer = null; }
    if (ticker) { clearInterval(ticker); ticker = null; }
  }

  function tick() {
    if (ticker || stopped) return;
    ticker = setInterval(function () {
      var status = STATUS[card.status] ? card.status : "queued";
      if (stopped || terminal(status)) { clearInterval(ticker); ticker = null; return; }
      var took = elapsed(status);
      $("elapsed").hidden = !took;
      $("elapsed").textContent = took;
    }, 1000);
  }

  function backoff() {
    var age = Date.now() - watchStart;
    return age < 60000 ? 3000 : age < 300000 ? 10000 : 30000;
  }

  function fail(message) {
    stop();
    notice = message;
    render();
  }

  function fromRow(row, digest, phase) {
    var environment = encodeURIComponent(row.environment || "");
    var thread = encodeURIComponent(row.threadId || "");
    var origin = String(row.webOrigin || "").trim().replace(/\/+$/, "");
    var model = {
      phase: phase,
      threadId: row.threadId,
      title: row.title || "Task",
      status: ROW[row.status] || "queued",
      digest: digest || "",
      provider: row.provider,
      driver: row.driver,
      model: row.model,
      startedAt: row.startedAt,
      completedAt: row.completedAt,
      excerpt: row.excerpt,
      ask: row.ask,
      signature: row.signature
    };
    if (environment && thread) model.appUrl = "t3code://threads/" + environment + "/" + thread;
    if (origin.indexOf("https://") === 0 && origin.indexOf("@") < 0) model.httpsUrl = origin + "/" + environment + "/" + thread;
    else if (origin.indexOf("http://") === 0 && origin.indexOf("@") < 0) model.webUrl = origin + "/" + environment + "/" + thread;
    return model;
  }

  function accept(model) {
    if (!model || !model.threadId) return;
    card = model;
    notice = "";
    if (terminal(card.status)) {
      card.phase = "wrap-up";
      stop();
    }
    render();
    if (!terminal(card.status)) tick();
    if (ready) schedule(longPoll ? 0 : backoff());
  }

  function schedule(delay) {
    if (timer || stopped || !card.threadId || terminal(card.status)) return;
    timer = setTimeout(poll, delay);
  }

  function poll() {
    timer = null;
    if (stopped || !card.threadId || terminal(card.status)) return;
    var args = { threadIds: [card.threadId], moment: "check-in" };
    if (longPoll) {
      args.waitSeconds = WAIT_SECONDS;
      if (card.signature) args.since = card.signature;
    }
    request("tools/call", { name: "delegation_status", arguments: args }).then(function (result) {
      if (result && result.isError) throw new Error(textOf(result) || "Could not read the thread.");
      var data = (result && result.structuredContent) || {};
      var rows = data.rows || [];
      var row = rows.filter(function (item) { return item.threadId === card.threadId; })[0] || rows[0];
      if (!row) throw new Error("No data for this thread.");
      errors = 0;
      accept(fromRow(row, data.digest || card.digest, terminal(ROW[row.status] || "queued") ? "wrap-up" : "update"));
    }).catch(function (error) {
      errors += 1;
      if (errors >= MAX_ERRORS) {
        card.phase = "wrap-up";
        fail((error && error.message) || "Could not update the card.");
        return;
      }
      // An older server rejects waitSeconds; a host may time the call out. Poll instead.
      longPoll = false;
      schedule(backoff());
    });
  }

  // The palette is fixed by design; the host only contributes fonts.
  function applyContext(ctx) {
    var vars = ctx && ctx.styles && ctx.styles.variables;
    if (!vars) return;
    ["--font-sans", "--font-mono"].forEach(function (key) {
      var value = vars[key];
      if (typeof value === "string" && value.length < 200) document.documentElement.style.setProperty(key, value);
    });
  }

  window.addEventListener("message", function (event) {
    var data = event.data;
    if (!data || data.jsonrpc !== "2.0") return;
    if (data.id != null && pending[data.id]) {
      var wait = pending[data.id];
      delete pending[data.id];
      if (data.error) wait.reject(new Error(data.error.message || "The host rejected the request."));
      else wait.resolve(data.result);
      return;
    }
    if (data.method === "ui/notifications/tool-result") {
      var params = data.params || {};
      if (params.isError || !params.structuredContent) {
        card = { phase: "wrap-up", status: "error", title: "Task without a card" };
        fail(textOf(params) || "This task has no card.");
        return;
      }
      accept(params.structuredContent);
    } else if (data.method === "ui/notifications/tool-cancelled") {
      fail((data.params && data.params.reason) || "Task cancelled.");
    } else if (data.method === "ui/notifications/host-context-changed") {
      applyContext(data.params);
    }
  });

  $("more").addEventListener("click", function () {
    expanded = !expanded;
    setSummary();
    reportSize();
  });

  $("open").addEventListener("click", function () {
    request("ui/open-link", { url: $("open").dataset.url }).catch(function () {
      rejected = true;
      render();
    });
  });

  $("copy").addEventListener("click", function () {
    var copy = $("copy");
    var value = copy.dataset.value;
    var flash = function (label) {
      copy.textContent = label;
      setTimeout(function () { copy.textContent = "Copy"; }, 1600);
    };
    var select = function () {
      showUrl(value);
      $("url").textContent = value;
      var range = document.createRange();
      range.selectNodeContents($("url"));
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      flash("Selected: ⌘C");
      reportSize();
    };
    if (!navigator.clipboard || !navigator.clipboard.writeText) return select();
    navigator.clipboard.writeText(value).then(function () { flash("Copied"); }, select);
  });

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appCapabilities: { availableDisplayModes: ["inline"] }
  }).then(function (result) {
    openLinks = !!(result && result.hostCapabilities && result.hostCapabilities.openLinks);
    applyContext(result && result.hostContext);
    ready = true;
    notify("ui/notifications/initialized");
    render();
    schedule(longPoll ? 0 : backoff());
  }).catch(function () {
    ready = true;
    if (!card.threadId) {
      notice = "The host didn't start the card.";
      render();
    }
  });
})();
</script>
</body>
</html>
